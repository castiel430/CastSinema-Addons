# CastSinema addon — gizli kurulum Worker'ı.
# Deploy: `wrangler deploy` (veya Cloudflare dashboard'a worker.js'i kopyalayın).
# SECRET_PATH ve KV namespace ID'si ASLA commit edilmemeli — bu dosya örnek
# olarak duruyor; kendi kopyanızı buna göre doldurun.

name = "castsinema-addons"
main = "worker.js"
compatibility_date = "2026-11-14"

# SECRET_PATH'i burada [vars] ile YAZMAYIN — gizli yolun repoya girmemesi için
# dashboard'dan veya `wrangler secret put SECRET_PATH` ile verin.

[[kv_namespaces]]
binding = "ADDON_FILES"
id = "BURAYA_KV_NAMESPACE_ID_YAZIN"
